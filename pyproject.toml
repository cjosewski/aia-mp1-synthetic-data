[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aia-mp1-synthetic-data"
version = "0.1.0"
description = "Auditable engineering Q&A generation and first-pass quality checks"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic>=2.12,<3",
  "instructor>=1.17,<2",
  "openai>=2,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.10,<4", "seaborn>=0.13,<1"]

[project.scripts]
aia-mp1 = "aia_mp1.cli:main"

[dependency-groups]
dev = [
    "pypdf>=6,<7",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aia_mp1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
